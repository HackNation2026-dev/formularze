# docker compose up --build   (R-09, R-14, R-15)
# Only the API publishes a port. llm and tika live on an internal network with no route to the Internet,
# so the pipeline provably runs without external services. The API joins both networks.
services:
  api:
    build: .
    image: cyfryzacja-formularzy/api:0.4.0
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file: .env
    environment:
      LLM_BASE_URL: http://llm:8080
      DOC_CONVERTER_URL: http://tika:9998
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [edge, backend]
    depends_on:
      - llm
      - tika
    restart: unless-stopped

  llm:
    # llama.cpp server, CPU build, pinned tag. Model weights mounted read-only at runtime (make models).
    # GPU hosts: use compose.gpu.yaml as an override.
    image: ghcr.io/ggml-org/llama.cpp:server-b12602
    user: "65534:65534"
    command: >
      --model /models/${LLM_GGUF:-Qwen3.5-4B-Q4_K_M.gguf}
      --host 0.0.0.0 --port 8080 --ctx-size 16384 --jinja --reasoning-budget 0
      --spec-type ngram-simple --cache-reuse 256
      --threads ${LLM_THREADS:-8} --temp 0 --no-webui
    volumes:
      - ./models:/models:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
    restart: unless-stopped

  tika:
    # Apache Tika (Apache-2.0): binary .doc -> text without any copyleft dependency
    image: apache/tika:3.3.0.0
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
    restart: unless-stopped

networks:
  edge: {}
  backend:
    internal: true
