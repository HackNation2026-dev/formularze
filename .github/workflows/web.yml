name: Aplikacja webowa
permissions:
  contents: read
on:
  push:
    paths: ['apps/web/**', 'design/tokens.css', '.github/workflows/web.yml']
  pull_request:
    paths: ['apps/web/**', 'design/tokens.css', '.github/workflows/web.yml']
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/package.json
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: python3 ../../scripts/sync_materials.py
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
