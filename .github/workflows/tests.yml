name: Testy i lint
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-pol
      - run: pip install -e ".[dev]"
      - run: python3 scripts/sync_materials.py
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest -q
