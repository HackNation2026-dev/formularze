[project]
name = "cyfryzacja-formularzy"
version = "0.4.0"
description = "HackNation 2026 / COI: AI service converting paper form files into e-form JSON configuration"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "anyio",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "pydantic-settings",
    "pdfplumber",
    "pypdf",
    "python-docx",
    "openpyxl",
    "odfpy",
    "pytesseract",
    "pillow",
    "pyjwt",
    "httpx",
    "jsonata-python",
    "rapidfuzz",
    "magika",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "pytest-cov", "import-linter"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["scripts/verify_docs.py", "scripts/publish_private.py", "scripts/material_manifest.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
formgen = ["static/review/*", "static/review/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Layer contract: a module may import only the layers below it. `ingest` and `compose` are independent of each other.
# Checked in CI with `lint-imports`.
[tool.importlinter]
root_package = "formgen"

[[tool.importlinter.contracts]]
name = "Layers: api > pipeline > extract > (compose | ingest) > schema > config"
type = "layers"
layers = [
    "formgen.api",
    "formgen.pipeline",
    "formgen.extract",
    "formgen.compose | formgen.ingest",
    "formgen.schema",
    "formgen.config",
]

[[tool.importlinter.contracts]]
name = "Evaluation reads only the schema"
type = "forbidden"
source_modules = ["formgen.eval"]
forbidden_modules = ["formgen.api", "formgen.pipeline", "formgen.extract", "formgen.compose", "formgen.ingest"]
